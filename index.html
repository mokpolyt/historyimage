<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ads Project Tracker</title>
<style>
:root{--navy:#102c38;--muted:#71838c;--line:#e6edf0;--bg:#f5f8fa;--pink:#ff5d91;--coral:#ff8a72;--cyan:#27bfd2;--lime:#eef58b;--mint:#dff8f4;--white:#fff;--shadow:0 18px 45px rgba(20,55,67,.09)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f8fbfc,#eef5f6);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--navy);padding:28px}.app{max-width:1500px;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:25px;margin-bottom:20px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);margin-bottom:7px}.title{font-size:34px;font-weight:900;letter-spacing:-.045em}.sub{color:var(--muted);font-size:13px;margin-top:7px}.badge{background:white;border:1px solid var(--line);padding:10px 14px;border-radius:999px;font-size:12px;font-weight:800;box-shadow:0 7px 22px rgba(20,55,67,.05)}
.layout{display:grid;grid-template-columns:235px minmax(0,1fr);gap:18px;align-items:start}.sidebar{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:24px;padding:12px;box-shadow:var(--shadow);position:sticky;top:20px}.side-title{padding:10px 10px 13px;font-size:11px;font-weight:900;letter-spacing:.14em;color:#82939b;text-transform:uppercase}.project-tab{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:9px;padding:11px 10px;border-radius:14px;cursor:pointer;margin:3px 0;color:#187f95;font-weight:850;text-align:left;transition:.18s}.project-tab:hover{background:#f1fafb;transform:translateX(2px)}.project-tab.active{background:linear-gradient(100deg,#eaf8f6,#f4f6bd);color:#14768a;box-shadow:inset 0 0 0 1px rgba(39,191,210,.1)}.project-dot{width:10px;height:10px;border-radius:50%;background:#89930b;flex:none}.project-tab.active .project-dot{background:linear-gradient(135deg,var(--pink),var(--coral))}.tab-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.main{background:var(--white);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);overflow:hidden}.project-head{display:flex;justify-content:space-between;align-items:center;padding:21px 24px;border-bottom:1px solid var(--line);gap:20px}.head-left{display:flex;align-items:center;gap:12px}.name-input{border:0;outline:0;background:linear-gradient(100deg,#eff9f7,#f4f6bd);color:#12788d;border-radius:999px;padding:10px 16px;font-size:18px;font-weight:900;min-width:170px}.rename-note{font-size:11px;color:#9aa8ae}.project-count{font-size:11px;font-weight:900;color:#91a0a6;letter-spacing:.12em}.table-wrap{padding:0 18px 20px;overflow-x:auto}.table{min-width:900px}.thead,.row{display:grid;grid-template-columns:1.45fr 1fr 1fr 1fr 1fr;gap:12px}.thead{padding:17px 7px 10px}.th{font-size:11px;font-weight:900;letter-spacing:.14em;color:#81929a;text-transform:uppercase}.row{align-items:stretch;margin:7px 0}.cell{min-height:116px;border:1px solid var(--line);border-radius:17px;background:#fbfcfd;display:flex;align-items:center;justify-content:center}.image-cell{padding:8px;gap:8px}.image-box{height:94px;width:135px;border-radius:12px;border:1px dashed #cdd9de;background:linear-gradient(135deg,#eef5f7,#fafcfc);display:flex;align-items:center;justify-content:center;overflow:hidden}.image-box img{width:100%;height:100%;object-fit:cover;display:none}.placeholder{font-size:10px;color:#9aa8ae;font-weight:750;text-align:center}.image-actions{display:flex;flex-direction:column;gap:6px}.browse{border:0;border-radius:10px;padding:8px 10px;background:linear-gradient(100deg,var(--pink),var(--coral));color:white;font-weight:900;font-size:10px;cursor:pointer}.row-no{font-size:10px;font-weight:900;color:#b0bbc0;position:absolute;align-self:flex-start;margin:9px}.metric-cell{flex-direction:column;gap:9px;position:relative}.metric{font-size:24px;font-weight:950;letter-spacing:-.04em;cursor:pointer}.metric.zero{color:#9caab0}.edit{border:0;border-radius:999px;background:linear-gradient(100deg,#ff5d91,#ff8a72);color:#fff;padding:7px 15px;font-size:10px;font-weight:900;cursor:pointer}.edit:hover,.browse:hover{transform:translateY(-1px);filter:brightness(1.04)}.empty-state{display:none}.status{position:fixed;left:50%;bottom:22px;transform:translate(-50%,12px);background:#102c38;color:#fff;padding:10px 17px;border-radius:999px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:50}.status.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:850px){body{padding:16px}.top{align-items:flex-start;flex-direction:column}.layout{grid-template-columns:1fr}.sidebar{position:static;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.side-title{grid-column:1/-1}.project-tab{justify-content:center}.tab-name{max-width:100px}.main{border-radius:20px}.project-head{padding:17px}.rename-note{display:none}}
@media(max-width:520px){.sidebar{grid-template-columns:repeat(2,1fr)}.title{font-size:28px}.name-input{min-width:130px;width:100%}.project-head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><div class="eyebrow">Performance Dashboard</div><div class="title">Ads Project Tracker</div><div class="sub">Pilih proyek di kiri. Setiap proyek memiliki 5 baris data yang sepenuhnya terpisah.</div></div>
    <div class="badge">8 PROJECTS · 5 ROWS / PROJECT</div>
  </div>
  <div class="layout">
    <aside class="sidebar"><div class="side-title">Projects</div><div id="tabs"></div></aside>
    <main class="main">
      <div class="project-head">
        <div class="head-left"><input id="projectName" class="name-input"><span class="rename-note">klik nama untuk rename</span></div>
        <div id="projectCount" class="project-count"></div>
      </div>
      <div class="table-wrap"><div class="table">
        <div class="thead"><div class="th">GAMBAR</div><div class="th">CTR</div><div class="th">HASIL</div><div class="th">CPR</div><div class="th">OPTIMASI</div></div>
        <div id="rows"></div>
      </div></div>
    </main>
  </div>
</div>
<div id="status" class="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://gjyeknwtoofpuvoaftfj.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_HBf14rn-fWP8AZ_OaLFfag_V6qNKjk5";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const TRACKER_ID=1;
const STORAGE_BUCKET="tracker-images";
const defaultProjects=Array.from({length:8},(_,p)=>({name:`PROYEK ${String.fromCharCode(65+p)}`,rows:Array.from({length:5},()=>({image:'',ctr:'0,0',hasil:'0,0',cpr:'0,0',optimasi:'0,0'}))}));
let projects=structuredClone(defaultProjects),active=0;
function showStatus(msg){const s=document.getElementById('status');s.textContent=msg;s.classList.add('show');clearTimeout(showStatus.t);showStatus.t=setTimeout(()=>s.classList.remove('show'),1600)}
function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function renderTabs(){const box=document.getElementById('tabs');box.innerHTML='';projects.forEach((p,i)=>{const b=document.createElement('button');b.className='project-tab'+(i===active?' active':'');b.innerHTML=`<span class="project-dot"></span><span class="tab-name">${esc(p.name)}</span>`;b.onclick=()=>{active=i;render()};box.appendChild(b)})}
function render(){renderTabs();const p=projects[active];document.getElementById('projectName').value=p.name;document.getElementById('projectCount').textContent=`PROJECT ${String(active+1).padStart(2,'0')} · 5 ROWS`;const rows=document.getElementById('rows');rows.innerHTML='';p.rows.forEach((r,i)=>{const el=document.createElement('div');el.className='row';el.innerHTML=`<div class="cell image-cell"><div class="row-no">#${i+1}</div><div class="image-box"><img><span class="placeholder">UPLOAD GAMBAR</span></div><div class="image-actions"><input class="file" type="file" accept="image/*" hidden><button class="browse">BROWSE</button></div></div>${metric(r,'ctr','CTR')}${metric(r,'hasil','HASIL')}${metric(r,'cpr','CPR')}${metric(r,'optimasi','OPTIMASI')}`;rows.appendChild(el);wireRow(el,r,i)});}
function metric(r,key,label){const val=r[key]??'0,0';return `<div class="cell metric-cell"><div class="metric ${val==='0,0'?'zero':''}" data-key="${key}">${esc(val)}</div><button class="edit" data-key="${key}">EDIT</button></div>`}
async function saveProjects(msg='Tersimpan'){const {error}=await supabaseClient.from('tracker').update({projects_data:projects}).eq('id',TRACKER_ID);if(error){console.error(error);showStatus('Gagal menyimpan');alert('Gagal menyimpan ke Supabase.\n\n'+error.message);return false}showStatus(msg);return true}
function wireRow(el,r,i){const img=el.querySelector('img'),ph=el.querySelector('.placeholder'),file=el.querySelector('.file'),browse=el.querySelector('.browse');if(r.image){img.src=r.image;img.style.display='block';ph.style.display='none'}browse.onclick=()=>file.click();file.onchange=async()=>{const f=file.files[0];if(!f)return;if(f.size>10*1024*1024){alert('Gunakan gambar di bawah 10 MB.');return}browse.disabled=true;browse.textContent='UPLOAD...';showStatus('Mengupload gambar...');try{const ext=(f.name.split('.').pop()||'jpg').toLowerCase();const path=`project-${active+1}/row-${i+1}-${Date.now()}.${ext}`;const {error:upErr}=await supabaseClient.storage.from(STORAGE_BUCKET).upload(path,f,{cacheControl:'3600',upsert:false});if(upErr)throw upErr;const {data:urlData}=supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(path);r.image=urlData.publicUrl;img.src=r.image;img.style.display='block';ph.style.display='none';await saveProjects('Gambar tersimpan')}catch(error){console.error(error);alert('Upload gagal.\n\n'+error.message);showStatus('Upload gagal')}finally{browse.disabled=false;browse.textContent='BROWSE'}};el.querySelectorAll('.edit').forEach(btn=>btn.onclick=async()=>{const key=btn.dataset.key;const current=r[key]??'0,0';const v=prompt(`Masukkan ${key.toUpperCase()} — ${projects[active].name}, Baris ${i+1}:`,current);if(v===null)return;const clean=v.trim();if(!clean)return;r[key]=clean;const m=el.querySelector(`.metric[data-key="${key}"]`);m.textContent=clean;m.classList.toggle('zero',clean==='0,0');await saveProjects()})}
document.getElementById('projectName').addEventListener('change',async e=>{projects[active].name=e.target.value.trim()||`PROYEK ${String.fromCharCode(65+active)}`;e.target.value=projects[active].name;renderTabs();await saveProjects('Nama proyek tersimpan')});
async function loadProjects(){showStatus('Loading...');try{const {data,error}=await supabaseClient.from('tracker').select('projects_data').eq('id',TRACKER_ID).single();if(error)throw error;if(data&&Array.isArray(data.projects_data)&&data.projects_data.length===8){projects=data.projects_data;render();showStatus('Data Supabase loaded');return}projects=structuredClone(defaultProjects);render();await saveProjects('Data awal tersimpan')}catch(error){console.error(error);render();showStatus('Gagal memuat');alert('Tidak bisa membaca data Supabase.\n\n'+error.message)}}
loadProjects();
</script>
</body>
</html>
